# Windows build: unit tests and both release builds on every push. When main carries a version
# (VersionPrefix/VersionSuffix in WebView2Guard.csproj) that has no release yet, the build creates
# the v<version> tag and publishes the release, with that version's CHANGELOG.md section as notes.
# Pushing a v* tag by hand does the same. Other branches publish a draft "Test build" release.
name: Windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write # publishing releases
    env:
      GH_TOKEN: ${{ github.token }}
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      # The version comes from the project file. Release builds (main and tags) carry it as is;
      # other builds get a "dev.<run>" pre-release suffix, so a later release always counts as newer.
      - name: Version
        id: ver
        run: |
          $proj = 'src/WebView2Guard/WebView2Guard.csproj'
          $prefix = (Select-Xml -Path $proj -XPath '//VersionPrefix').Node.InnerText
          $suffix = "$((Select-Xml -Path $proj -XPath '//VersionSuffix').Node.InnerText)"
          $version = if ($suffix) { "$prefix-$suffix" } else { $prefix }
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$version") {
            Write-Host "::error::tag ${{ github.ref_name }} does not match version $version"; exit 1
          }
          $release = "${{ github.ref_type }}" -eq "tag" -or "${{ github.ref }}" -eq "refs/heads/main"
          $build = if ($release) { $suffix } elseif ($suffix) { "$suffix.dev.${{ github.run_number }}" } else { "dev.${{ github.run_number }}" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "prefix=$prefix" >> $env:GITHUB_OUTPUT
          "suffix=$build" >> $env:GITHUB_OUTPUT
          Write-Host "WebView2 Guard $version (build: $prefix$(if ($build) { "-$build" }))"

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Tests
        run: dotnet test tests/WebView2Guard.Tests/WebView2Guard.Tests.csproj -c Release --logger "console;verbosity=normal"

      - name: Publish (framework-dependent, single file)
        run: >
          dotnet publish src/WebView2Guard/WebView2Guard.csproj -c Release -r win-x64
          --self-contained false -p:PublishSingleFile=true -o publish/fd
          "-p:VersionPrefix=${{ steps.ver.outputs.prefix }}" "-p:VersionSuffix=${{ steps.ver.outputs.suffix }}"
          -p:GuardFlavor=fd

      - name: Publish (self-contained, single file)
        run: >
          dotnet publish src/WebView2Guard/WebView2Guard.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o publish/sc
          "-p:VersionPrefix=${{ steps.ver.outputs.prefix }}" "-p:VersionSuffix=${{ steps.ver.outputs.suffix }}"
          -p:GuardFlavor=selfcontained

      # The in-app updater looks for these exact names and checks them against SHA256SUMS.txt.
      - name: Package
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item publish/fd/WebView2Guard.exe out/WebView2Guard-win-x64.exe
          Copy-Item publish/sc/WebView2Guard.exe out/WebView2Guard-win-x64-selfcontained.exe
          Get-FileHash out/*.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content out/SHA256SUMS.txt
          Get-Content out/SHA256SUMS.txt
          Get-ChildItem out | Format-Table Name, Length

      - name: WebView2 probe (test helper)
        run: |
          dotnet publish tests/WebView2Probe/WebView2Probe.csproj -c Release -r win-x64 --self-contained false -o probe
          dotnet publish tests/WebView2Probe/WebView2Probe.csproj -c Release -r win-x86 --self-contained true -o probe86

      # The real thing on the runner, through the command line: install, firewall rules, the Fixed
      # runtime from Microsoft (signature, permissions), policies, domains, export/import, the window,
      # a real WebView2 app blocked and allowed, uninstall. The runner is a throwaway VM with
      # administrator rights.
      - name: End-to-end test
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path out/WebView2Guard-win-x64-selfcontained.exe).Path
          $dir = Join-Path $env:ProgramFiles 'WebView2Guard'
          $pol = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2'
          function Guard([string]$arguments, [int]$expect = 0) {
            Write-Host "> WebView2Guard $arguments"
            $o = Join-Path $env:RUNNER_TEMP 'o.txt'; $e = Join-Path $env:RUNNER_TEMP 'e.txt'
            $p = Start-Process $exe -ArgumentList $arguments -Wait -PassThru -NoNewWindow -RedirectStandardOutput $o -RedirectStandardError $e
            $text = (Get-Content $o, $e -Raw -ErrorAction SilentlyContinue) -join ''
            Write-Host $text
            if ($p.ExitCode -ne $expect) { throw "exit code $($p.ExitCode), expected $expect" }
            return $text
          }
          function Value($key, $name) { (Get-ItemProperty "$pol\$key" -ErrorAction SilentlyContinue).$name }
          function Rules { @(Get-NetFirewallRule -Group 'WebView2 Guard' -ErrorAction SilentlyContinue) }

          Guard '--help' | Out-Null
          Guard '--allow' 2 | Out-Null

          # 1. Install: exe in Program Files, sync task, a block rule for every Evergreen version.
          Guard '--install' | Out-Null
          if (-not (Test-Path "$dir\WebView2Guard.exe")) { throw 'install: exe missing' }
          if (-not (Get-ScheduledTask -TaskPath '\WebView2Guard\' -TaskName Sync -ErrorAction SilentlyContinue)) { throw 'install: sync task missing' }
          $evergreen = @(Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application\*\msedgewebview2.exe" -ErrorAction SilentlyContinue)
          Write-Host "Evergreen versions on the runner: $($evergreen.Count)"
          foreach ($f in $evergreen) {
            $v = Split-Path (Split-Path $f.FullName) -Leaf
            if (-not (Rules | Where-Object { $_.Action -eq 'Block' -and ($_.Name -like "*$v*" -or $_.DisplayName -like "*$v*") })) { throw "no block rule for Evergreen $v" }
          }

          # 2. Allowing needs the runtime first.
          Guard '--allow testhost.exe' 1 | Out-Null

          # 3. The Fixed runtime from Microsoft: signature checked, App Container permissions, allow rule.
          Guard '--runtime download x64' | Out-Null
          if (-not (Test-Path "$dir\Runtime\x64\msedgewebview2.exe")) { throw 'runtime: msedgewebview2.exe missing' }
          if ((Get-AuthenticodeSignature "$dir\Runtime\x64\msedgewebview2.exe").Status -ne 'Valid') { throw 'runtime: signature' }
          if (-not ((icacls "$dir\Runtime\x64") -match 'APPLICATION PACKAGES')) { throw 'runtime: App Container permissions missing' }
          if (-not (Rules | Where-Object { $_.Action -eq 'Allow' -and $_.Enabled -eq 'True' })) { throw 'runtime: allow rule missing' }
          if ((Guard '--runtime download x64') -notmatch 'up to date') { throw 'runtime: second download not skipped' }

          # 4. Policies and domains.
          Guard '--allow testhost.exe' | Out-Null
          if ((Value BrowserExecutableFolder testhost.exe) -ne "$dir\Runtime\x64") { throw 'allow: policy value' }
          Guard '--domains testhost.exe example.com,*.example.org' | Out-Null
          $extra = Value AdditionalBrowserArguments testhost.exe
          if ($extra -notmatch 'MAP \* ~NOTFOUND' -or $extra -notmatch 'EXCLUDE example\.com' -or $extra -notmatch 'EXCLUDE \*\.example\.org') { throw "domains: $extra" }
          Guard '--domains other.exe example.com' 1 | Out-Null
          if ((Guard '--status') -notmatch 'testhost\.exe\s+Allowed') { throw 'status: testhost.exe not shown as allowed' }

          # 5. Export, block, import: the decision and the domains come back.
          $cfg = Join-Path $env:RUNNER_TEMP 'config.json'
          Guard "--export `"$cfg`"" | Out-Null
          $json = Get-Content $cfg -Raw | ConvertFrom-Json
          $app = $json.Apps | Where-Object ExeName -eq 'testhost.exe'
          if (-not $app.Allowed -or $app.Domains.Count -ne 2) { throw 'export: testhost.exe' }
          Guard '--block testhost.exe' | Out-Null
          if (Value BrowserExecutableFolder testhost.exe) { throw 'block: policy still there' }
          if (Value AdditionalBrowserArguments testhost.exe) { throw 'block: domains still there' }
          Guard "--import `"$cfg`"" | Out-Null
          if ((Value BrowserExecutableFolder testhost.exe) -ne "$dir\Runtime\x64") { throw 'import: policy' }
          if ((Value AdditionalBrowserArguments testhost.exe) -notmatch 'EXCLUDE example\.com') { throw 'import: domains' }
          if (-not (Get-ChildItem "$env:ProgramData\WebView2Guard\backups\*.reg")) { throw 'no .reg backups' }

          # 6. The window opens and keeps running.
          $ui = Start-Process "$dir\WebView2Guard.exe" -PassThru
          $t = 0
          while ($t -lt 30 -and -not $ui.HasExited -and $ui.MainWindowHandle -eq 0) { Start-Sleep 1; $ui.Refresh(); $t++ }
          if ($ui.HasExited) { throw "window: the app exited with $($ui.ExitCode)" }
          if ($ui.MainWindowHandle -eq 0) { throw 'window: no main window after 30 s' }
          Start-Sleep 5
          if ($ui.HasExited) { throw "window: the app exited with $($ui.ExitCode)" }
          Write-Host "window: '$($ui.MainWindowTitle)' open"

          # While the app runs, a new Evergreen version is blocked within seconds, and its rule goes
          # when the version is removed (a copy of the real exe stands in for a Windows update).
          if ($evergreen.Count -gt 0) {
            $fake = Join-Path (Split-Path (Split-Path $evergreen[0].FullName)) '999.0.0.1'
            New-Item -ItemType Directory -Force $fake | Out-Null
            Copy-Item $evergreen[0].FullName $fake
            $t = 0
            while ($t -lt 60 -and -not (Rules | Where-Object { $_.Action -eq 'Block' -and $_.Name -like '*999.0.0.1*' })) { Start-Sleep 2; $t += 2 }
            if (-not (Rules | Where-Object { $_.Action -eq 'Block' -and $_.Name -like '*999.0.0.1*' })) { throw 'watcher: no block rule for a new Evergreen version after 60 s' }
            Write-Host "watcher: new Evergreen version blocked after about $t s"
            Remove-Item $fake -Recurse -Force
            $t = 0
            while ($t -lt 60 -and (Rules | Where-Object { $_.Name -like '*999.0.0.1*' })) { Start-Sleep 2; $t += 2 }
            if (Rules | Where-Object { $_.Name -like '*999.0.0.1*' }) { throw 'watcher: the rule of a removed version is still there after 60 s' }
            Write-Host "watcher: rule removed after about $t s"
          }
          Stop-Process -Id $ui.Id -Force

          # 7. A real WebView2 app (tests/WebView2Probe): offline on Evergreen, online on the allowed
          #    runtime once allowed, and only the allowed domains resolve.
          Get-NetFirewallProfile | Format-Table Name, Enabled, DefaultOutboundAction | Out-String | Write-Host
          Set-NetFirewallProfile -All -Enabled True
          $probe = (Resolve-Path probe/WebView2Probe.exe).Path
          $fixed = "$dir\Runtime\x64"
          function Probe($url) {
            $out = Join-Path $env:RUNNER_TEMP "probe-$([guid]::NewGuid()).json"
            $p = Start-Process $probe -ArgumentList "$url `"$out`" 60" -PassThru
            if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force; throw "probe: no answer for $url" }
            if (-not (Test-Path $out)) { throw "probe: no result for $url (exit $($p.ExitCode))" }
            $r = Get-Content $out -Raw | ConvertFrom-Json
            Write-Host "probe $url -> success=$($r.success) status=$($r.status) browser=$($r.browserPath) $($r.browserVersion)"
            return $r
          }
          $r = Probe 'https://example.com/'
          if ($r.browserPath -like "$fixed*") { throw 'a blocked app ran on the allowed runtime' }
          if ($r.success) { throw 'a blocked app reached the internet' }
          Guard '--allow WebView2Probe.exe' | Out-Null
          $r = Probe 'https://example.com/'
          if ($r.browserPath -notlike "$fixed*") { throw "the allowed app ran on $($r.browserPath)" }
          if (-not $r.success) { throw "the allowed app could not load the page: $($r.status) $($r.error)" }
          Guard '--domains WebView2Probe.exe example.org' | Out-Null
          $r = Probe 'https://example.com/'
          if ($r.success) { throw 'domain limit: example.com loaded' }
          $r = Probe 'https://example.org/'
          if (-not $r.success) { throw "domain limit: example.org did not load: $($r.status)" }
          Guard '--block WebView2Probe.exe' | Out-Null
          $r = Probe 'https://example.com/'
          if ($r.success -or $r.browserPath -like "$fixed*") { throw 'blocking again did not take effect' }

          # 8. Strict mode: every app without its own policy runs on the blocked copy (64- and 32-bit), the
          #    copy is hard-linked, allowed apps keep the allowed runtime, and turning it off cleans up.
          Guard '--strict on' | Out-Null
          $copy = Value BrowserExecutableFolder '*'
          if ($copy -notlike "$dir\Runtime\Blocked\*") { throw "strict: * -> $copy" }
          if (-not (Rules | Where-Object { $_.Action -eq 'Block' -and $_.Name -like 'WV2G-BlockCopy-*' })) { throw 'strict: no block rule for the copy' }
          $links = @(fsutil hardlink list "$copy\msedgewebview2.exe")
          if ($links.Count -lt 2) { throw "strict: the copy is not hard-linked ($links)" }
          $r = Probe 'https://example.com/'
          if ($r.browserPath -notlike "$copy*" -or $r.success) { throw "strict: x64 app on $($r.browserPath), success=$($r.success)" }
          $probe64 = $probe; $probe = (Resolve-Path probe86/WebView2Probe.exe).Path
          $r = Probe 'https://example.com/'
          if ($r.browserPath -notlike "$copy*" -or $r.success) { throw "strict: x86 app on $($r.browserPath), success=$($r.success)" }
          $probe = $probe64
          Guard '--allow WebView2Probe.exe' | Out-Null
          $r = Probe 'https://example.com/'
          if ($r.browserPath -notlike "$fixed\*" -or -not $r.success) { throw "strict: allowed app on $($r.browserPath), success=$($r.success)" }
          Guard '--block WebView2Probe.exe' | Out-Null
          if ((Guard '--status') -notmatch 'Strict mode: on') { throw 'strict: status' }
          Start-Sleep 5
          Guard '--strict off' | Out-Null
          if (Value BrowserExecutableFolder '*') { throw 'strict off: * policy left' }
          if (Test-Path "$dir\Runtime\Blocked") { throw 'strict off: the unused copy was not removed' }
          if (Rules | Where-Object { $_.Name -like 'WV2G-BlockCopy-*' }) { throw 'strict off: copy rule left' }
          $r = Probe 'https://example.com/'
          if ($r.browserPath -like "$dir\*" -or $r.success) { throw "strict off: app on $($r.browserPath), success=$($r.success)" }
          Guard '--strict on' | Out-Null   # uninstall must clean it up
          Start-Sleep 5

          # 9. Sync, then uninstall: nothing of ours is left.
          Guard '--sync' | Out-Null
          Guard '--uninstall' | Out-Null
          if (Value BrowserExecutableFolder testhost.exe) { throw 'uninstall: policy left' }
          if (Value AdditionalBrowserArguments testhost.exe) { throw 'uninstall: domains left' }
          if ((Rules).Count -ne 0) { throw "uninstall: $((Rules).Count) rules left" }
          if (Get-ScheduledTask -TaskPath '\WebView2Guard\' -ErrorAction SilentlyContinue) { throw 'uninstall: tasks left' }
          if (Test-Path "$dir\Runtime\x64") { throw 'uninstall: runtime left' }
          if (Value BrowserExecutableFolder '*') { throw 'uninstall: strict-mode policy left' }
          if (Test-Path "$dir\Runtime\Blocked") { throw 'uninstall: blocked copy left' }
          if (Select-String -Path "$env:ProgramData\WebView2Guard\guard.log" -Pattern 'ERROR' -SimpleMatch -Quiet) {
            Get-Content "$env:ProgramData\WebView2Guard\guard.log" | Write-Host
            Write-Warning 'guard.log has errors (expected ones come from the negative tests)'
          }
          Write-Host 'install, runtime, allow, domains, export/import, window, Evergreen watcher, WebView2 app, strict mode, uninstall: ok'

      # Artifacts count against the account's shared storage: keep them briefly. Releases stay.
      - uses: actions/upload-artifact@v5
        continue-on-error: true
        with:
          name: WebView2Guard-win-x64
          path: out/
          retention-days: 2
          compression-level: 9

      # Builds of other branches go to a single draft release, replaced each time: drafts are
      # visible only to the repository's owner, the in-app updater ignores them and, unlike
      # artifacts, they do not use Actions storage.
      - name: Test build (draft release)
        if: github.event_name == 'push' && github.ref_type == 'branch' && github.ref != 'refs/heads/main'
        run: |
          $old = gh api "repos/${{ github.repository }}/releases?per_page=100" --jq '.[] | select(.draft and .name == "Test build") | .id'
          foreach ($id in $old) { gh api -X DELETE "repos/${{ github.repository }}/releases/$id" | Out-Null }
          $notes = "Branch ``${{ github.ref_name }}`` at ${{ github.sha }}, version ${{ steps.ver.outputs.prefix }}-${{ steps.ver.outputs.suffix }}. For testing only; the next test build replaces it."
          gh release create "test-build" (Get-ChildItem out/*).FullName --draft --target "${{ github.sha }}" --title "Test build" --notes $notes

      - name: Release
        if: github.event_name == 'push' && (github.ref_type == 'tag' || github.ref == 'refs/heads/main')
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $files = (Get-ChildItem out/*).FullName
          $existing = gh release view "v$v" --json assets --jq '.assets | length' 2>$null
          if ($LASTEXITCODE -eq 0) {
            # A release made by hand on GitHub gets the files attached; a complete one is left alone.
            if ([int]$existing -eq 0) { gh release upload "v$v" $files; Write-Host "files attached to v$v" }
            else { Write-Host "v$v is already released" }
            exit 0
          }
          $global:LASTEXITCODE = 0
          # The changelog section of this version becomes the release notes.
          $text = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($text, "(?ms)^## \[?$([regex]::Escape($v))\]?[^\n]*\n(.*?)(?=^## |\z)")
          if (-not $m.Success) { Write-Host "::error::CHANGELOG.md has no section for $v"; exit 1 }
          $notes = $m.Groups[1].Value.Trim()
          $notes += "`n`n**Download:** ``WebView2Guard-win-x64.exe`` needs the [.NET 10 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/10.0); ``WebView2Guard-win-x64-selfcontained.exe`` needs nothing. Windows 10/11, 64-bit, administrator rights. ``SHA256SUMS.txt`` has the checksums."
          Set-Content notes.md $notes
          $pre = if ($v -like '*-*') { '--prerelease' } else { '--latest' }
          # gh creates the tag on this commit when it does not exist yet.
          gh release create "v$v" $files --target "${{ github.sha }}" --title "WebView2 Guard $v" --notes-file notes.md $pre
