name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Version from tag
        id: ver
        shell: pwsh
        run: |
          $ref = "${{ github.event.release.tag_name }}"
          if (-not $ref) { $ref = $env:GITHUB_REF_NAME }
          if ($ref -match '^v(\d+\.\d+\.\d+)(?:-(.+))?$') { $prefix = $Matches[1]; $suffix = $Matches[2] }
          else { $prefix = '0.1.0'; $suffix = 'dev' }
          "prefix=$prefix" >> $env:GITHUB_OUTPUT
          "suffix=$suffix" >> $env:GITHUB_OUTPUT
          "Version: $prefix-$suffix"

      - name: Publish (framework-dependent, single file)
        run: >
          dotnet publish src/WebView2Guard/WebView2Guard.csproj -c Release -r win-x64
          --self-contained false -p:PublishSingleFile=true -o publish/fd
          -p:VersionPrefix=${{ steps.ver.outputs.prefix }} -p:VersionSuffix=${{ steps.ver.outputs.suffix }}
          -p:GuardFlavor=fd

      - name: Publish (self-contained, single file)
        run: >
          dotnet publish src/WebView2Guard/WebView2Guard.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o publish/sc
          -p:VersionPrefix=${{ steps.ver.outputs.prefix }} -p:VersionSuffix=${{ steps.ver.outputs.suffix }}
          -p:GuardFlavor=selfcontained

      - name: Rename outputs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item publish/fd/WebView2Guard.exe dist/WebView2Guard-win-x64.exe
          Copy-Item publish/sc/WebView2Guard.exe dist/WebView2Guard-win-x64-selfcontained.exe
          Get-FileHash dist/*.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        continue-on-error: true # the account's artifact storage quota must not fail the build
        with:
          name: WebView2Guard-win-x64
          path: dist/

      - name: GitHub release (tag push)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $pre = if ($env:GITHUB_REF_NAME -like '*-*') { '--prerelease' } else { $null }
          gh release create $env:GITHUB_REF_NAME (Get-ChildItem dist/*.exe).FullName dist/SHA256SUMS.txt --generate-notes --title "WebView2 Guard $env:GITHUB_REF_NAME" $pre

      - name: Attach files to a release created on GitHub
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" (Get-ChildItem dist/*.exe).FullName dist/SHA256SUMS.txt --clobber
